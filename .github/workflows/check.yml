name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest releases on each line that block the compromised eMudhra/emSign intermediates (src/nodeVersion.ts).
        # Exact versions: a bare 24 or 26 can resolve to an older release cached on the runner image.
        include:
          - { os: ubuntu-latest, node: '24.22.1' }
          - { os: ubuntu-latest, node: '26.12.1' }
          # The service runs on macOS (launchd), and some tests cover macOS behavior.
          - { os: macos-latest, node: '26.12.1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # npm run check ends with the privacy check (scripts/privacy-check.ts). PRIVACY_DENYLIST is a repository secret with the
      # maintainer's private values; pull requests from forks and from Dependabot do not receive secrets, so only the generic
      # patterns run there. GITHUB_EVENT_PATH is set by Actions, so a pull request's title and description are scanned too.
      - run: npm run check
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
