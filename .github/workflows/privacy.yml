name: Privacy

# Re-checks a pull request's title, description and commit messages whenever they change; the CI matrix does not run
# when only the description is edited. Needs no dependencies: the script uses only Node. Pull requests from forks and
# from Dependabot do not receive secrets, so only the generic patterns run there (see CONTRIBUTING.md, "Privacy check").
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  privacy:
    name: privacy check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pull request's commit messages are scanned too
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # type stripping runs the .ts script directly
      - name: Check files, commit messages, title and description
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/privacy-check.ts --commits "$BASE_SHA..$HEAD_SHA"
