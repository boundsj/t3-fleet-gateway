<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc">
  <title id="title">Connect Grok Bot: ask for links, paste two fields, then test</title>
  <desc id="desc">An illustrated setup guide with fictional values. After creating a webhook routine, ask Grok for links to its Webhook URL, Webhook key and Authorization header. In the private routine panel, copy POST to into Webhook URL on the gateway dashboard, and header into Full authorization header. The separate key is already included in the full header. Choose the moonbase project and click Connect and Test. Test accepted means the receiver accepted the ping; check the bot conversation to confirm the routine ran. The gateway then sends job updates without waiting for the bot's next poll.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbf7ef"/><stop offset="1" stop-color="#f2ebdf"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#b8a68c" opacity=".15"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#bd512b" stroke-width="1.8" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #27251f; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #8a5b42; }
      .title { font-size: 44px; font-weight: 750; letter-spacing: -1.6px; }
      .subtitle { font-size: 24px; fill: #6a6258; }
      .card { fill: #fffdf8; stroke: #ddd3c3; stroke-width: 1.5; }
      .step { font-size: 18px; font-weight: 750; fill: #fff9ed; }
      .heading { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
      .body { font-size: 23px; fill: #514d43; }
      .small { font-size: 20px; fill: #6a6258; }
      .label { font-size: 23px; font-weight: 650; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 22px; }
      .field { fill: #fff; stroke: #d6cbbb; stroke-width: 1.5; }
      .wire { stroke: #bd512b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1190" rx="24" fill="url(#paper)"/>
  <rect width="1200" height="1190" rx="24" fill="url(#dots)"/>
  <text class="eyebrow" x="48" y="48">T3 FLEET GATEWAY / CONNECT A ROUTINE</text>
  <text class="title" x="48" y="105">Give your bot a doorbell.</text>
  <text class="subtitle" x="48" y="145">Job updates reach your routine without waiting for its next poll.</text>
  <!-- A small bell, drawn as paths so no emoji font is required. -->
  <g transform="translate(1082 50)" fill="none" stroke="#bd512b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 46h44c-8-8-7-15-7-26a15 15 0 0 0-30 0c0 11 1 18-7 26Z"/>
    <path d="M30 55a7 7 0 0 0 12 0M36 0v-5M4 13l-5-5M67 13l5-5"/>
  </g>

  <!-- Step 1: the prompt opens the right private fields. -->
  <rect class="card" x="44" y="180" width="1112" height="220" rx="20"/>
  <circle cx="85" cy="220" r="21" fill="#bd512b"/>
  <text class="step" x="85" y="227" text-anchor="middle">1</text>
  <text class="heading" x="120" y="229">Routine created? Ask Grok for its field links.</text>
  <rect x="72" y="252" width="1056" height="121" rx="13" fill="#f1ebe0"/>
  <path d="M104 278h-8v12h12v-8h-5v-4h1m20 0h-8v12h12v-8h-5v-4h1" fill="#b49b7f"/>
  <text class="body" x="146" y="285">Give me links to the Webhook URL, Webhook key,</text>
  <text class="body" x="146" y="317">and Authorization header for this routine.</text>
  <text class="small" x="146" y="349">Open the private fields; don’t print their values in chat.</text>

  <!-- Step 2: the field mapping is literal, not a screenshot of either app. -->
  <rect class="card" x="44" y="420" width="1112" height="436" rx="20"/>
  <circle cx="85" cy="460" r="21" fill="#bd512b"/>
  <text class="step" x="85" y="467" text-anchor="middle">2</text>
  <text class="heading" x="120" y="469">Copy two fields. Choose a project.</text>
  <text class="eyebrow" x="72" y="516">GROK / PRIVATE ROUTINE PANEL</text>
  <text class="eyebrow" x="650" y="516">GATEWAY / CONNECT GROK BOT</text>

  <text class="label" x="72" y="553">POST to</text>
  <rect class="field" x="72" y="565" width="480" height="49" rx="9"/>
  <text class="mono" x="88" y="597">https://example.com/hook</text>
  <path class="wire" d="M568 590h63"/>
  <text class="label" x="650" y="553">Webhook URL</text>
  <rect class="field" x="650" y="565" width="478" height="49" rx="9"/>
  <text class="mono" x="666" y="597">https://example.com/hook</text>

  <text class="label" x="72" y="651">header</text>
  <rect class="field" x="72" y="663" width="480" height="49" rx="9"/>
  <text class="mono" x="88" y="695">Authorization: Bearer ••••••</text>
  <path class="wire" d="M568 688h63"/>
  <text class="label" x="650" y="651">Full authorization header</text>
  <rect class="field" x="650" y="663" width="478" height="49" rx="9"/>
  <text class="mono" x="666" y="695">Authorization: Bearer ••••••</text>

  <rect x="72" y="740" width="480" height="86" rx="11" fill="#f1ebe0"/>
  <text class="body" x="91" y="773">The full header includes the key.</text>
  <text class="small" x="91" y="804">No need to copy the separate key field.</text>
  <text class="label" x="650" y="749">Project</text>
  <rect class="field" x="650" y="762" width="478" height="50" rx="9"/>
  <text class="mono" x="666" y="795">moonbase</text>
  <path d="m1090 783 7 7 7-7" fill="none" stroke="#6a6258" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: distinguish HTTP acceptance from the routine's chat reply. -->
  <rect class="card" x="44" y="876" width="1112" height="202" rx="20"/>
  <circle cx="85" cy="916" r="21" fill="#bd512b"/>
  <text class="step" x="85" y="923" text-anchor="middle">3</text>
  <text class="heading" x="120" y="925">Connect, test, then check your chat.</text>
  <rect x="72" y="972" width="298" height="60" rx="12" fill="#293e31"/>
  <text x="221" y="1010" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#fff9ec">Connect &amp; Test</text>
  <path class="wire" d="M386 1002h40"/>
  <rect x="448" y="948" width="680" height="106" rx="13" fill="#e8efe4"/>
  <circle cx="476" cy="978" r="11" fill="#41664a"/>
  <path d="m471 978 3 3 7-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="498" y="986" style="font-size:25px;font-weight:700;fill:#314f39">Test accepted</text>
  <text class="small" x="470" y="1016">The receiver accepted the ping.</text>
  <text class="small" x="470" y="1042">Check Grok’s reply to confirm the routine ran.</text>

  <text x="600" y="1120" text-anchor="middle" style="font-size:24px;font-weight:650;fill:#514d43">No command. No config file. No restart.</text>
  <text class="small" x="600" y="1156" text-anchor="middle">Illustrated setup · Fictional values · Paste secrets only into the private dashboard</text>
</svg>
